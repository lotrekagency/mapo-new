name: CD

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "Release mode"
        required: true
        type: choice
        options:
          - normal
          - dry-run
        default: dry-run

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  guard:
    name: Block release from main
    runs-on: ubuntu-latest
    steps:
      - name: Disallow running from main
        if: github.ref_name == 'main'
        run: |
          echo "::error::The CD workflow must not be run from 'main'. Trigger it from 'beta' (or another release branch)."
          exit 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: guard
    if: github.event.inputs.release_mode == 'normal'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Ensure npm >= 11.5.1 (required for OIDC trusted publishing)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fallback only. With a Trusted Publisher configured on npmjs.com plus
          # `id-token: write` above, npm authenticates via OIDC and this is
          # ignored. Needed for the first publish of brand-new packages; remove
          # once every package has a Trusted Publisher registered.
          NPM_TOKEN: ${{ secrets['NPM_TOKEN'] }}
          # One JSON line per published package (scripts/release/summary-plugin.cjs),
          # read by the Slack step below.
          RELEASE_SUMMARY_FILE: ${{ runner.temp }}/release-summary.jsonl
        run: pnpm release

      - name: Announce on Slack
        # The packages are already published: a Slack problem must not fail the release.
        continue-on-error: true
        env:
          RELEASE_SUMMARY_FILE: ${{ runner.temp }}/release-summary.jsonl
          # A Slack app bot token with the chat:write scope. Until it is set, the
          # step only prints a notice.
          SLACK_BOT_TOKEN: ${{ secrets['SLACK_BOT_TOKEN'] }}
          # The channel ID, as a repository variable (or a secret).
          SLACK_RELEASE_CHANNEL: ${{ vars['SLACK_RELEASE_CHANNEL'] || secrets['SLACK_RELEASE_CHANNEL'] }}
        run: node scripts/release/notify-slack.mjs

  release_dryrun:
    name: Release Dry Run
    runs-on: ubuntu-latest
    needs: guard
    if: github.event.inputs.release_mode == 'dry-run'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Release Dry Run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release:dry
